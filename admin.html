<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F7F4FB">
<title>Cura Admin</title>
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/styles.css">
<style>
  body{overflow-y:auto}
  .admin{max-width:1180px;margin:0 auto;padding:calc(22px + var(--safe-t)) 20px 60px}
  .top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .top .brand{padding:0}
  .top .spacer{flex:1}
  .login{max-width:380px;margin:12vh auto 0}
  .tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}
  .tile{padding:14px}
  .tile .v{font:700 26px/1.1 'Bricolage Grotesque',sans-serif;margin-top:4px}
  .tile .l{font-size:12.5px;color:var(--muted)}
  .chart{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:2px;align-items:end;height:120px;border-bottom:1px solid var(--line);padding-top:10px}
  .chart .col{height:100%;display:flex;align-items:flex-end;justify-content:center;position:relative;cursor:default}
  .chart .bar{width:min(70%,26px);background:var(--brand);border-radius:4px 4px 0 0;min-height:2px}
  .chart .col:hover .bar{background:var(--brand-deep)}
  .chart .col:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:8px;padding:5px 8px;font-size:12px;color:var(--ink);z-index:3}
  .chart-x{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:2px;font-size:11px;color:var(--faint);text-align:center;margin-top:5px}
  .toolbar{display:flex;gap:10px;align-items:center;margin:18px 0 10px}
  .toolbar .input{max-width:320px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--surface-2)}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  th.num{text-align:right}
  .who strong{display:block}
  .who small,.preview{color:var(--muted);font-size:12.5px}
  .preview{max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
  .detail-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
  .convo{display:flex;flex-direction:column;max-height:70vh;overflow-y:auto;padding:4px 2px}
  .convo .msg{max-width:85%}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
  .kv dt{color:var(--muted)}
  .kv dd{margin:0}
  details summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:6px}
  .log{font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;color:var(--muted);margin-top:8px}
  .err{color:var(--danger);font-size:14px;margin-top:10px}
  @media (max-width:900px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.detail-grid{grid-template-columns:1fr}.hide-sm{display:none}}
  @media (max-width:520px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.admin{padding-left:14px;padding-right:14px}td,th{padding:9px 6px}}
</style>
</head>
<body>
<div class="admin" id="root"></div>
<script src="/admin.js"></script>
</body>
</html>
