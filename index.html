<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#f7f7f3" id="themeColor">
<script>
  // Light by default; "dark" or "system" if chosen in Me → Appearance. Runs before the page paints, so there's no flash.
  (function () {
    var t = 'light';
    try { t = new URLSearchParams(location.search).get('theme') || localStorage.getItem('mira-theme') || 'light'; } catch (e) {}
    document.documentElement.setAttribute('data-theme', t);
    var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.getElementById('themeColor').setAttribute('content', dark ? '#000000' : '#f7f7f3');
  })();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cura">
<meta name="description" content="Text Cura how you feel. She keeps track of your cycle and symptoms and helps you prepare for appointments.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<title>Cura</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app">
  <nav class="nav" aria-label="Main">
    <div class="brand"><span class="brand-mark">c</span><span class="brand-name">cura</span></div>
    <button class="nav-item" data-route="chat"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3c5 0 9 3.4 9 7.6s-4 7.6-9 7.6c-.9 0-1.8-.1-2.6-.3L5 20l.9-3.6C4.1 15 3 13 3 10.6 3 6.4 7 3 12 3z"/></svg></span><span class="nav-text">Chat</span></button>
    <button class="nav-item" data-route="today"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 13h4v7H4zM10 8h4v12h-4zM16 4h4v16h-4z"/></svg></span><span class="nav-text">Today</span></button>
    <button class="nav-item" data-route="community"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.2"/><path d="M3 19.5c.9-3.3 3.2-5 6-5s5.1 1.7 6 5"/><circle cx="16.8" cy="9.5" r="2.6"/><path d="M16.5 14.3c2.3.1 3.9 1.6 4.5 4.2"/></svg></span><span class="nav-text">Community</span><span class="nav-badge" id="cmBadge" hidden></span></button>
    <button class="nav-item" data-route="cycle"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16"/></svg></span><span class="nav-text">Cycle</span></button>
    <button class="nav-item" data-route="visit"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M8.5 10h7M8.5 14h7M8.5 18h4"/></svg></span><span class="nav-text">Visits</span></button>
    <button class="nav-item" data-route="me"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c1.2-3.8 4-5.5 7.5-5.5s6.3 1.7 7.5 5.5"/></svg></span><span class="nav-text">Me</span></button>
  </nav>
  <main id="view" class="view" tabindex="-1"></main>
</div>
<div id="sheet"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
